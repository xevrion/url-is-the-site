<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>loader</title>
</head>
<body>
<p id="msg">nothing after the # in this url, so there is nothing to show.</p>
<script>
// same trick, but the payload rides in the fragment instead of the whole url.
// browsers never send the part after # to a server, so the page still only
// exists inside your link.
const raw = location.hash.slice(1);
if (raw) {
  const bytes = Uint8Array.from(atob(decodeURIComponent(raw)), c => c.charCodeAt(0));
  new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")))
    .text()
    .then(html => { document.open(); document.write(html); document.close(); });
}
</script>
</body>
</html>
