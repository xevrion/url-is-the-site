<!doctype html><body>
<iframe id=f src="http://localhost:8731/index.html" width=900 height=700></iframe>
<div id=res>running</div>
<script>
const f = document.getElementById("f");
f.onload = async () => {
  if (f.contentWindow.location.hash) return;
  const d = f.contentDocument;
  d.getElementById("src").value = "<h1>custom thing</h1><p>typed by a user</p>";
  d.getElementById("go").click();
  await new Promise(r => setTimeout(r, 600));
  const url = d.getElementById("out").value;
  const stat = d.getElementById("stat").textContent;
  document.getElementById("res").textContent = "STAT: " + stat + " || URL: " + url.slice(0,60);
  // now round trip it
  const probe = document.createElement("iframe");
  probe.width=900; probe.height=300; probe.src = url;
  probe.onload = () => {
    setTimeout(() => {
      document.getElementById("res").textContent += " || ROUNDTRIP: " + probe.contentDocument.body.innerHTML.slice(0,80);
    }, 500);
  };
  document.body.appendChild(probe);
};
</script>
